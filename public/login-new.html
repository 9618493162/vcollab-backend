<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - VCollab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root[data-theme="light"] {
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --border: #e2e8f0;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --error-bg: #fee2e2;
  --error-text: #991b1b;
}

:root[data-theme="dark"] {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --border: #334155;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --error-bg: #7f1d1d;
  --error-text: #fecaca;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  transition: background 0.3s;
}

.login-container {
  width: 100%;
  max-width: 440px;
}

.theme-toggle {
  position: absolute;
  top: 24px;
  right: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--card-bg);
  color: var(--text-primary);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.theme-toggle:hover {
  transform: scale(1.1);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  margin-bottom: 32px;
  text-decoration: none;
}

.logo-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

.logo-text {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--text-primary);
}

.login-card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  border: 1px solid var(--border);
}

h1 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 32px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.subtitle {
  text-align: center;
  color: var(--text-secondary);
  margin-bottom: 32px;
  font-size: 15px;
}

.alert {
  padding: 14px 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 500;
  display: none;
  animation: slideDown 0.3s;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.alert-error {
  background: var(--error-bg);
  color: var(--error-text);
  border: 1px solid var(--error-text);
}

.alert-success {
  background: #d1fae5;
  color: #065f46;
  border: 1px solid #059669;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  transition: all 0.2s;
}

input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

input::placeholder {
  color: var(--text-secondary);
}

.password-wrapper {
  position: relative;
}

.toggle-password {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 18px;
}

.forgot-password {
  text-align: right;
  margin-top: 8px;
}

.forgot-password a {
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}

.forgot-password a:hover {
  text-decoration: underline;
}

.btn-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 24px;
  font-family: 'Inter', sans-serif;
}

.btn-submit:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
}

.btn-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 24px 0;
  color: var(--text-secondary);
  font-size: 14px;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.social-buttons {
  display: flex;
  gap: 12px;
}

.btn-social {
  flex: 1;
  padding: 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-social:hover {
  border-color: var(--accent);
  background: var(--card-bg);
}

.register-link {
  text-align: center;
  margin-top: 24px;
  color: var(--text-secondary);
  font-size: 15px;
}

.register-link a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.register-link a:hover {
  text-decoration: underline;
}

.back-home {
  text-align: center;
  margin-top: 24px;
}

.back-home a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.back-home a:hover {
  color: var(--accent);
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>

<div class="login-container">
  <a href="index-new.html" class="logo">
    <div class="logo-icon">📹</div>
    <span class="logo-text">VCollab</span>
  </a>
  
  <div class="login-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue to your account</p>
    
    <div id="errorMessage" class="alert alert-error"></div>
    <div id="successMessage" class="alert alert-success"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
        </div>
        <div class="forgot-password">
          <a href="#forgot" onclick="showForgotPassword(event)">Forgot password?</a>
        </div>
      </div>
      
      <button type="submit" class="btn-submit" id="loginBtn">
        Sign In
      </button>
    </form>
    
    <div class="divider">OR</div>
    
    <div class="social-buttons">
      <button class="btn-social" onclick="signInWithGoogle()">
        <span>🔵</span> Google
      </button>
      <button class="btn-social" onclick="signInWithGitHub()">
        <span>⚫</span> GitHub
      </button>
    </div>
    
    <div class="register-link">
      Don't have an account? <a href="register-new.html">Create one</a>
    </div>
    
    <div class="back-home">
      <a href="index-new.html">← Back to home</a>
    </div>
  </div>
</div>

<script>
const API_URL = '/api';

// Theme Switcher
function toggleTheme() {
  const html = document.documentElement;
  const currentTheme = html.getAttribute('data-theme');
  const newTheme = currentTheme === 'light' ? 'dark' : 'light';
  const icon = document.getElementById('themeToggle');
  
  html.setAttribute('data-theme', newTheme);
  icon.textContent = newTheme === 'light' ? '🌙' : '☀️';
  localStorage.setItem('theme', newTheme);
}

// Load saved theme
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme') || 'light';
  const icon = document.getElementById('themeToggle');
  document.documentElement.setAttribute('data-theme', savedTheme);
  icon.textContent = savedTheme === 'light' ? '🌙' : '☀️';
});

// Password toggle
function togglePassword() {
  const input = document.getElementById('password');
  const btn = document.querySelector('.toggle-password');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
}

// Login form handling
const loginForm = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const errorMessage = document.getElementById('errorMessage');
const successMessage = document.getElementById('successMessage');

loginForm.addEventListener('submit', async function(event) {
  event.preventDefault();
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  
  // Hide messages
  errorMessage.style.display = 'none';
  successMessage.style.display = 'none';
  
  // Disable button
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in...';
  
  try {
    const response = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    });
    
    const data = await response.json();
    
    if (response.ok && data.success) {
      // Store token
      localStorage.setItem('token', data.token);
      
      // Show success
      successMessage.textContent = '✅ Login successful! Redirecting...';
      successMessage.style.display = 'block';
      
      // Redirect to dashboard
      setTimeout(() => {
        window.location.href = 'dashboard-dark.html';
      }, 1000);
      
    } else {
      throw new Error(data.message || 'Login failed');
    }
    
  } catch (error) {
    console.error('Login error:', error);
    errorMessage.textContent = error.message || 'Failed to sign in. Please check your credentials.';
    errorMessage.style.display = 'block';
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign In';
  }
});

// ============================================================================
// OAUTH SIGN-IN

  const authUrl = `https://github.com/login/oauth/authorize?` +

    `scope=${SCOPE}`;

  showMessage('warning', '⚠️ GitHub OAuth requires configuration. Using demo login for now...');
  
  setTimeout(() => {

  // Uncomment when backend OAuth is configured:

// ============================================================================
// FORGOT PASSWORD
// ============================================================================

function showForgotPassword(event) {
  event.preventDefault();
  
  const email = prompt('🔑 Enter your email address to reset password:');
  
  if (!email || !email.trim()) {
    return;
  }
  
  if (!isValidEmail(email)) {
    showMessage('error', '❌ Please enter a valid email address');
    return;
  }
  
  // Show loading
  showMessage('info', '📧 Sending password reset email...');
  
  // Simulate sending reset email (replace with real API call)
  setTimeout(() => {
    showMessage('success', `✅ Password reset link sent to ${email}! Check your inbox.`);
    
    // In real implementation, call backend:
    // sendPasswordResetEmail(email);
  }, 1500);
}

async function sendPasswordResetEmail(email) {
  try {
    const response = await fetch(`${API_URL}/auth/forgot-password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      showMessage('success', `✅ Password reset link sent to ${email}`);
    } else {
      throw new Error(data.message || 'Failed to send reset email');
    }
  } catch (error) {
    showMessage('error', '❌ ' + error.message);
  }
}

// ============================================================================
// UTILITIES
// ============================================================================

function showMessage(type, message) {
  const errorMsg = document.getElementById('errorMessage');
  const successMsg = document.getElementById('successMessage');
  
  // Hide all messages first
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
  
  // Show appropriate message
  if (type === 'error') {
    errorMsg.textContent = message;
    errorMsg.style.display = 'block';
  } else if (type === 'success') {
    successMsg.textContent = message;
    successMsg.style.display = 'block';
  } else if (type === 'info') {
    successMsg.textContent = message;
    successMsg.style.background = '#dbeafe';
    successMsg.style.color = '#1e40af';
    successMsg.style.borderColor = '#3b82f6';
    successMsg.style.display = 'block';
  } else if (type === 'warning') {
    successMsg.textContent = message;
    successMsg.style.background = '#fef3c7';
    successMsg.style.color = '#92400e';
    successMsg.style.borderColor = '#f59e0b';
    successMsg.style.display = 'block';
  }
}

function isValidEmail(email) {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return emailRegex.test(email);
}

console.log('✅ Login page loaded');
console.log('🔵 Google Sign-In: Click to demo (OAuth setup required for production)');
console.log('⚫ GitHub Sign-In: Click to demo (OAuth setup required for production)');
console.log('🔑 Forgot Password: Click to send reset email');
</script>

</body>
</html>
