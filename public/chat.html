<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - VCollab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Navigation */
        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 28px;
            font-weight: 600;
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            list-style: none;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #5f6368;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: block;
            white-space: nowrap;
        }

        .nav-links a:hover {
            background: #f1f3f4;
            color: #202124;
        }

        .nav-links a.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* Chat Container */
        .chat-container {
            max-width: 1000px;
            margin: 48px auto;
            padding: 24px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            height: calc(100vh - 150px);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f3f4;
            margin-bottom: 24px;
        }

        .chat-header h1 {
            color: #202124;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        #userInfo {
            color: #5f6368;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(to bottom, #f8f9fa 0%, #ffffff 100%);
            border-radius: 16px;
            margin-bottom: 20px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f3f4;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #bdc1c6;
        }

        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 70%;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #f1f3f4;
            color: #202124;
            border-bottom-left-radius: 4px;
        }

        .message-sender {
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 6px;
            opacity: 0.9;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 6px;
        }

        .chat-input-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-container input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e8eaed;
            border-radius: 28px;
            font-size: 15px;
            transition: all 0.2s;
            outline: none;
        }

        .chat-input-container input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }

        .chat-input-container button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 28px;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }

        .chat-input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102,126,234,0.4);
        }

        .chat-input-container button:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .chat-container {
                margin: 20px;
                height: calc(100vh - 100px);
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <h2>VCollab</h2>
    </div>
    <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="meetings-list.html">Meetings</a></li>
        <li><a href="chat.html" class="active">Chat</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="#" onclick="API.auth.logout()">Logout</a></li>
    </ul>
</nav>

<div class="chat-container">
    <div class="chat-header">
        <h1>💬 Team Chat</h1>
        <p id="userInfo"></p>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message received">
            <div class="message-sender">System</div>
            <div>Welcome to VCollab Chat! Start chatting with your team.</div>
            <div class="message-time">Just now</div>
        </div>
    </div>
    
    <div class="chat-input-container">
        <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">📤 Send</button>
    </div>
</div>

<script src="js/api.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
// Check authentication
if (!requireAuth()) {
    throw new Error('Authentication required');
}

// Get user data
const userData = getUserData();
if (userData) {
    document.getElementById('userInfo').textContent = `Logged in as: ${userData.fullName}`;
}

// Connect to Socket.IO
const socket = io('http://localhost:5002');

socket.on('connect', () => {
    console.log('Connected to chat server');
    socket.emit('join-room', 'general-chat', userData.id);
});

socket.on('receive-message', (message) => {
    displayMessage(message, false);
});

function sendMessage() {
    const input = document.getElementById('messageInput');
    const messageText = input.value.trim();
    
    if (messageText === '') return;
    
    const message = {
        sender: userData.fullName,
        senderId: userData.id,
        text: messageText,
        timestamp: new Date().toISOString()
    };
    
    // Display locally
    displayMessage(message, true);
    
    // Send via Socket.IO
    socket.emit('send-message', message, 'general-chat');
    
    // Clear input
    input.value = '';
}

function displayMessage(message, isSent) {
    const chatMessages = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
    
    const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    
    messageDiv.innerHTML = `
        ${!isSent ? `<div class="message-sender">${message.sender}</div>` : ''}
        <div>${message.text}</div>
        <div class="message-time">${time}</div>
    `;
    
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}
</script>

</body>
</html>
