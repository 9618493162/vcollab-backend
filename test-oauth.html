<!DOCTYPE html>
<html>
<head>
    <title>VCollab OAuth Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #4285F4;
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }
        .github {
            background: #333;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🔐 VCollab OAuth Test</h1>
    <p>Click the buttons below to test if Google and GitHub OAuth are configured correctly.</p>
    
    <button onclick="testGoogleOAuth()">🔵 Test Google OAuth</button>
    <button class="github" onclick="testGitHubOAuth()">⚫ Test GitHub OAuth</button>
    
    <div id="result"></div>

    <script>
        const supabaseUrl = 'https://wwdbdstbbpcmcbzwgunj.supabase.co'
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3ZGJkc3RiYnBjbWNiendndW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTAyNzIsImV4cCI6MjA5OTc4NjI3Mn0.NC7VUoJNKM3BkP0RagRhi_FScAyP2TDOpx-crPP4OnA'
        
        const { createClient } = supabase
        const supabaseClient = createClient(supabaseUrl, supabaseAnonKey)
        
        function showResult(message, isSuccess) {
            const resultDiv = document.getElementById('result')
            resultDiv.className = 'result ' + (isSuccess ? 'success' : 'error')
            resultDiv.innerHTML = message
        }
        
        async function testGoogleOAuth() {
            showResult('Testing Google OAuth...', true)
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/success.html'
                    }
                })
                
                if (error) {
                    showResult(`❌ Google OAuth Error: ${error.message}<br><br><strong>Fix:</strong> Make sure you enabled Google OAuth in Supabase Dashboard`, false)
                } else {
                    showResult('✅ Google OAuth is configured! Redirecting to Google...', true)
                }
            } catch (err) {
                showResult(`❌ Error: ${err.message}`, false)
            }
        }
        
        async function testGitHubOAuth() {
            showResult('Testing GitHub OAuth...', true)
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'github',
                    options: {
                        redirectTo: window.location.origin + '/success.html'
                    }
                })
                
                if (error) {
                    showResult(`❌ GitHub OAuth Error: ${error.message}<br><br><strong>Fix:</strong> Make sure you enabled GitHub OAuth in Supabase Dashboard`, false)
                } else {
                    showResult('✅ GitHub OAuth is configured! Redirecting to GitHub...', true)
                }
            } catch (err) {
                showResult(`❌ Error: ${err.message}`, false)
            }
        }
        
        // Check if we came back from OAuth
        window.addEventListener('load', () => {
            const hash = window.location.hash
            if (hash && hash.includes('access_token')) {
                showResult('✅ OAuth Success! You have been authenticated.', true)
            }
        })
    </script>
</body>
</html>
